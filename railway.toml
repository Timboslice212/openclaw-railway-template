[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

# A Railway Volume mounted here keeps configuration, credentials, sessions,
# channel state, and workspace files across deploys.
requiredMountPath = "/data"

[variables]
OPENCLAW_STATE_DIR = "/data/.openclaw"
OPENCLAW_WORKSPACE_DIR = "/data/workspace"
OPENCLAW_INTERNAL_GATEWAY_HOST = "127.0.0.1"
OPENCLAW_INTERNAL_GATEWAY_PORT = "18789"
OPENCLAW_VOLUME_ROOT = "/data"
XDG_CONFIG_HOME = "/data/.config"
