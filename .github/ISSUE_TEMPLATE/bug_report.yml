name: Bug report
description: Report a reproducible problem with the Railway integration
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not submit secrets or vulnerabilities here. Follow SECURITY.md for security reports.
  - type: input
    id: commit
    attributes:
      label: Repository commit
      description: Full commit SHA used by the deployment.
    validations:
      required: true
  - type: input
    id: openclaw
    attributes:
      label: OpenClaw version
      description: Pinned image version from Dockerfile.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failure stage
      options:
        - Railway deployment
        - Setup login
        - Provider configuration
        - Optional channel configuration
        - Gateway readiness
        - Dashboard handoff
        - Upgrade or persistence
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and reproduction steps
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove passwords, API keys, tokens, cookies, domains, bootstrap fragments, and private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues and read the troubleshooting guide.
          required: true
        - label: I removed all secrets and private data from this report.
          required: true
        - label: This is not a security vulnerability.
          required: true

